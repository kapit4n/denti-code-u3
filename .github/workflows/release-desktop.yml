name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-2022
    outputs:
      releaseId: ${{ steps.build_msi.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check the tag and read the desktop API URL
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          api_url=$(node -e "const fs=require('fs');const line=fs.readFileSync('.env.example','utf8').split('\n').find(l=>l.startsWith('VITE_API_URL='));if(!line)process.exit(1);process.stdout.write(line.slice('VITE_API_URL='.length).trim())")
          echo "VITE_API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the embedded clinic server resources
        run: pnpm run bundle:desktop-server

      - id: build_msi
        name: Build and publish the MSI
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm --dir apps/desktop exec tauri
          tagName: ${{ github.ref_name }}
          releaseName: Denti-Code U3 ${{ github.ref_name }}
          releaseBody: Desktop installers for Denti-Code U3 (Windows MSI and Ubuntu .deb). The apps call the API URL compiled into each build; see docs/desktop.md.
          releaseDraft: true
          prerelease: false
          args: --bundles msi
          uploadWorkflowArtifacts: true

  deb:
    needs: msi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check the tag and read the desktop API URL
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          api_url=$(node -e "const fs=require('fs');const line=fs.readFileSync('.env.example','utf8').split('\n').find(l=>l.startsWith('VITE_API_URL='));if(!line)process.exit(1);process.stdout.write(line.slice('VITE_API_URL='.length).trim())")
          echo "VITE_API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the embedded clinic server resources
        run: pnpm run bundle:desktop-server

      - id: build_deb
        name: Build and publish the DEB
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm --dir apps/desktop exec tauri
          releaseId: ${{ needs.msi.outputs.releaseId }}
          args: --bundles deb
          uploadWorkflowArtifacts: true

  server-linux:
    needs: msi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the source version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the seeded server bundle
        run: pnpm run bundle:server

      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" .artifacts/*.tar.gz --clobber

  server-windows:
    needs: msi
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the source version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the seeded server bundle
        shell: bash
        run: pnpm run bundle:server

      - name: Upload the bundle to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" .artifacts/*.zip --clobber
